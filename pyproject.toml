[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "looped-fok-memory"
version = "0.1.0"
description = "Unified On-GPU Read+Write Feeling-of-Knowing (FOK) Memory Architecture for Looped Transformers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.3",
    "torch>=2.1",
    "gguf>=0.10",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["looped_fok*"]
